[telegram]
# Get these values from https://my.telegram.org/apps
api_id = YOUR_API_ID
api_hash = YOUR_API_HASH
bot_token = YOUR_BOT_TOKEN

[database]
type = sqlite  # or postgresql
path = ../database/tg_manager.db  # for sqlite
# For PostgreSQL, uncomment and fill these
# host = localhost
# port = 5432
# user = username
# password = password
# database = tg_manager

[app]
debug = true
log_level = INFO
theme = dark  # or light